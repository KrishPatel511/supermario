<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Emberleaf logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2f7a"/>
      <stop offset="0.6" stop-color="#1a1650"/>
      <stop offset="1" stop-color="#0a0a26"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.5" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#d97a00"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="0.45" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#e60012"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dff7a"/>
      <stop offset="1" stop-color="#00922a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#ffd34d" stroke-opacity="0.35" stroke-width="0.8"/>
  <circle cx="32" cy="34" r="22" fill="url(#glow)"/>

  <!-- leaves -->
  <path d="M32 55 C21 55 11 49 10 38 C21 37 30 43 32 55 Z" fill="url(#leaf)" stroke="#05521a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M32 55 C43 55 53 49 54 38 C43 37 34 43 32 55 Z" fill="url(#leaf)" stroke="#05521a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M32 53 C27 47 20 43 14 40 M32 53 C37 47 44 43 50 40" fill="none" stroke="#05521a" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>

  <!-- flame -->
  <path d="M32 7 C34 16 45 20 45 32 C45 40 39 46 32 46 C25 46 19 40 19 32 C19 26 22 22 26 18 C26 24 28 26 30 26 C29 19 30 13 32 7 Z" fill="url(#flame)" stroke="#7a1200" stroke-width="1" stroke-linejoin="round"/>
  <path d="M32 25 C33 30 38.500 32 38.500 38 C38.500 42 35.500 44 32 44 C28.500 44 25.500 42 25.500 38 C25.500 34.500 28 32.500 30 29 C30.300 31 31 32 32 25 Z" fill="url(#core)"/>

  <!-- sparkles -->
  <path d="M12 16 l1.200 3 l3 1.200 l-3 1.200 l-1.200 3 l-1.200 -3 l-3 -1.200 l3 -1.200 Z" fill="#fff2a8"/>
  <path d="M52 20 l0.900 2.200 l2.200 0.900 l-2.200 0.900 l-0.900 2.200 l-0.900 -2.200 l-2.200 -0.900 l2.200 -0.900 Z" fill="#fff2a8"/>
</svg>
